services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: proyecto_app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    environment:
      SESSION_DRIVER: file
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: proyecto_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - vendor_data:/var/www/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.4
    container_name: proyecto_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: proyecto
      MYSQL_USER: proyecto
      MYSQL_PASSWORD: proyecto
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
  vendor_data:
