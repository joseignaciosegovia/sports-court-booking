name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'          # usa la misma versión que en local
          extensions: pdo_sqlite, mbstring, bcmath, intl
          coverage: none              # sin Xdebug: más rápido

      - name: Dependencias de Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node y assets (Vite)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test